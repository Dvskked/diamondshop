<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="HBO Max permanente">
  <defs>
    <radialGradient id="mbg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#5A21C9"/>
      <stop offset="100%" stop-color="#11063A"/>
    </radialGradient>
    <radialGradient id="mglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9D5CFF" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#9D5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E3D4FF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#mbg)"/>
  <circle cx="320" cy="185" r="175" fill="url(#mglow)"/>
  <text x="320" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#E9D7FF" letter-spacing="16">HBO</text>
  <text x="320" y="252" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="900" fill="url(#mtext)" letter-spacing="-4">max</text>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" fill-opacity=".55" letter-spacing="7">PERMANENTE</text>
